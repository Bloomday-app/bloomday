<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bloomday — Formulaire d'équipe</title>
  <link rel="shortcut icon" href="img/favicon.ico">
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--b1:#D4A843;--b2:#FF8C7A;--b3:#18A86B;--bg:#FFF8F0;--bg2:#FFFDF9;--txt:#2D1B14;--txt2:#8B6F60;--txt3:#C8B0A4;--brd:#EEE0D4;--brd2:#DDD0C0;--grad:linear-gradient(135deg,#D4A843,#FF8C7A);--sh:0 4px 24px rgba(45,27,20,.08);--rad:18px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
    .tf-wrap{max-width:540px;margin:0 auto;padding:24px 16px 80px}
    .tf-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px;text-decoration:none}
    .tf-logo img{width:32px;height:32px;object-fit:contain;border-radius:8px}
    .tf-logo span{font-family:'Playfair Display',serif;font-size:22px;font-weight:800;color:var(--txt)}
    .tf-card{background:var(--bg2);border-radius:var(--rad);box-shadow:var(--sh);padding:24px;margin-bottom:16px;border:1px solid var(--brd)}
    h1{font-family:'Playfair Display',serif;font-size:20px;font-weight:800;margin-bottom:4px}
    h2{font-size:16px;font-weight:600;margin-bottom:16px;color:var(--b2)}
    label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--txt2)}
    input,select,textarea{width:100%;border:1.5px solid var(--brd);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;background:var(--bg);color:var(--txt);transition:border-color .2s;margin-bottom:12px;font-family:inherit}
    input:focus,select:focus,textarea:focus{border-color:var(--b2)}
    textarea{resize:vertical;min-height:80px}
    .btn{display:inline-block;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:700;border:none;cursor:pointer;transition:opacity .15s;font-family:inherit}
    .btn:hover{opacity:.85}
    .btn-primary{background:var(--grad);color:#fff;width:100%;text-align:center}
    .btn-ghost{background:transparent;border:1.5px solid var(--brd);color:var(--txt2)}
    .btn-sm{padding:7px 12px;font-size:12px}
    .tf-steps{display:flex;gap:8px;margin-bottom:20px}
    .tf-step{flex:1;text-align:center;font-size:12px;font-weight:600;padding:6px 0;border-radius:8px;background:var(--bg2);border:1px solid var(--brd);color:var(--txt2)}
    .tf-step.active{background:var(--grad);color:#fff;border-color:transparent}
    .tf-step.done{background:#E3F9F0;color:#0A5C3A;border-color:transparent}
    .member-card{border:1.5px solid var(--brd);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
    .member-card .mname{font-weight:700;font-size:14px}
    .member-card .mmeta{font-size:12px;color:var(--txt2)}
    .share-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .share-btn{padding:8px;border-radius:10px;font-size:12px;font-weight:600;border:1.5px solid var(--brd);background:var(--bg2);cursor:pointer;text-align:center;transition:all .15s;font-family:inherit;color:var(--txt2)}
    .share-btn:hover{border-color:var(--b2);color:var(--b2)}
    .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
    .badge-ok{background:#E3F9F0;color:#0A5C3A}
    .badge-wait{background:#FDF6E3;color:#7A5A10}
    .progress-bar{height:6px;border-radius:3px;background:var(--brd);margin-bottom:16px}
    .progress-fill{height:100%;border-radius:3px;background:var(--grad);transition:width .4s}
    .relation-tag{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--brd);border-radius:8px;padding:4px 10px;margin:4px}
    .relation-tag input{border:none;background:transparent;padding:0;margin:0;font-size:13px;width:120px;color:var(--txt)}
    .relation-tag button{background:none;border:none;cursor:pointer;color:var(--txt3);font-size:16px;padding:0;line-height:1}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--txt);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
    .toast.show{opacity:1}
    #tf-view-teams,#tf-view-create,#tf-view-dashboard,#tf-view-member,#tf-view-thanks{display:none}
    .tf-gender-row{display:flex;gap:10px;margin-bottom:12px}
    .tf-gender-btn{flex:1;padding:10px;border:1.5px solid var(--brd);border-radius:10px;background:var(--bg2);font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;font-family:inherit;color:var(--txt)}
    .tf-gender-btn.selected{border-color:var(--b2);background:#FFF0EE;color:var(--b2)}
    .tf-toggle{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .tf-toggle input[type=checkbox]{width:20px;height:20px;accent-color:var(--b2);margin:0;flex-shrink:0}
    .tf-dash-card{background:var(--bg2);border-radius:var(--rad);box-shadow:var(--sh);padding:16px;margin-bottom:12px;border:1px solid var(--brd)}
    .tf-topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--brd);position:sticky;top:0;z-index:50;margin:0 -16px 20px;backdrop-filter:blur(8px)}
    .tf-back{display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font-size:14px;font-weight:600;color:var(--txt2);font-family:inherit;padding:6px 10px;border-radius:8px;text-decoration:none;transition:background .15s}
    .tf-back:hover{background:var(--brd)}
    .tf-topbar-logo{display:flex;align-items:center;gap:8px;text-decoration:none}
    .tf-topbar-logo img{width:26px;height:26px;object-fit:contain;border-radius:6px}
    .tf-topbar-logo span{font-family:'Playfair Display',serif;font-size:18px;font-weight:800;color:var(--txt)}
    .tf-topbar-right{width:80px;position:relative;display:flex;justify-content:flex-end;align-items:center}
    #tf-modal-qr,#tf-modal-delete{position:fixed;inset:0;background:rgba(45,27,20,.6);z-index:100;align-items:center;justify-content:center;padding:20px}
    .tf-modal-inner{background:var(--bg2);border-radius:var(--rad);padding:24px;max-width:300px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.3)}
    @media print{body>*{display:none!important}#tf-modal-qr{display:flex!important;position:static;background:none;padding:0}}
    /* ── AVATAR TOPBAR ── */
    .tf-avatar-btn{width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;background:var(--grad);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0;font-family:inherit;flex-shrink:0}
    .tf-avatar-btn img{width:100%;height:100%;object-fit:cover}
    .tf-avatar-menu{position:absolute;right:0;top:40px;background:var(--bg2);border:1px solid var(--brd);border-radius:var(--rad);box-shadow:var(--sh);padding:12px 14px;min-width:200px;z-index:200}
    .tf-avatar-menu-name{font-weight:700;font-size:14px;margin-bottom:2px;color:var(--txt)}
    .tf-avatar-menu-email{font-size:12px;color:var(--txt2);margin-bottom:12px;word-break:break-all}
    .tf-avatar-menu-link{display:block;text-align:center;padding:8px 12px;background:var(--grad);color:#fff;border-radius:8px;text-decoration:none;font-size:13px;font-weight:700}
    /* ── LAYOUT DEUX COLONNES ── */
    .tf-two-col{display:grid;grid-template-columns:40% 60%;gap:24px;align-items:start}
    .tf-col-left{position:sticky;top:68px}
    body.tf-dashboard-active .tf-wrap,body.tf-step2-active .tf-wrap{max-width:1200px}
    @media(max-width:767px){.tf-two-col{display:block}.tf-col-left{position:static}}
  </style>
</head>
<body>
  <div class="tf-wrap">
    <div class="tf-topbar">
      <a class="tf-back" href="https://mybloomday.app">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Retour
      </a>
      <a class="tf-topbar-logo" href="https://mybloomday.app">
        <img src="img/logo.png" alt="Bloomday">
        <span>Bloomday</span>
      </a>
      <div class="tf-topbar-right"></div>
    </div>

    <!-- Mode: Mes équipes -->
    <div id="tf-view-teams"></div>

    <!-- Mode: Création -->
    <div id="tf-view-create">
      <div class="tf-steps" id="tf-wizard-steps"></div>
      <div id="tf-step-1"></div>
      <div id="tf-step-2" style="display:none"></div>
    </div>

    <!-- Mode: Dashboard -->
    <div id="tf-view-dashboard">
      <div class="tf-card">
        <h1 id="tf-dash-title"></h1>
        <div class="progress-bar"><div class="progress-fill" id="tf-progress-fill" style="width:0%"></div></div>
        <p id="tf-progress-text" style="font-size:13px;color:var(--txt2);margin-bottom:16px"></p>
        <div id="tf-dash-actions"></div>
      </div>
      <div id="tf-member-cards"></div>
      <div id="tf-add-member-inline" style="display:none"></div>
    </div>

    <!-- Mode: Formulaire membre -->
    <div id="tf-view-member">
      <div class="tf-card">
        <h1 id="tf-member-title"></h1>
        <p id="tf-member-sub" style="color:var(--txt2);font-size:13px;margin-bottom:20px"></p>
        <div id="tf-member-form"></div>
      </div>
    </div>

    <!-- Confirmation membre -->
    <div id="tf-view-thanks" style="text-align:center;padding:60px 16px">
      <div style="font-size:56px">🎉</div>
      <h1 id="tf-thanks-title" style="margin:16px 0 8px"></h1>
      <p id="tf-thanks-sub" style="color:var(--txt2)"></p>
    </div>
  </div>

  <div id="tf-modal-qr" style="display:none">
    <div class="tf-modal-inner">
      <div style="display:flex;justify-content:flex-end;margin-bottom:4px">
        <button onclick="tfCloseQRModal()" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--txt3);line-height:1;padding:0">✕</button>
      </div>
      <div id="tf-modal-qr-name" style="font-family:'Playfair Display',serif;font-size:18px;font-weight:800;margin-bottom:16px"></div>
      <div id="tf-modal-qr-code" style="display:flex;justify-content:center;margin-bottom:12px"></div>
      <div id="tf-modal-qr-url" style="font-size:11px;color:var(--txt3);word-break:break-all;margin-bottom:16px"></div>
      <button onclick="window.print()" class="btn btn-primary" id="tf-modal-print-btn">Imprimer</button>
    </div>
  </div>

  <div id="tf-modal-delete" style="display:none">
    <div class="tf-modal-inner" id="tf-modal-delete-inner"></div>
  </div>

  <div class="toast" id="tf-toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="lib/qrcode.min.js"></script>
  <script src="js/team-form-i18n.js"></script>
  <script src="js/team-form.js"></script>
</body>
</html>
